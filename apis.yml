name: Intrepida Bio
description: >-
  Intrepida Bio, Inc. is a preclinical biotechnology company (founded 2019,
  headquartered in Encinitas / San Diego, CA) developing medicines that modulate
  the innate immune system to fight cancer and other diseases. Working with
  Biouniversa s.r.l., the company holds worldwide rights to develop proprietary
  monoclonal antibodies against the novel targets BAG3 and its receptor IFITM-2 —
  a signaling axis tumors hijack to build a growth-promoting, immune-evasive
  microenvironment (notably in pancreatic ductal adenocarcinoma, PDAC). Intrepida
  raised roughly $9.5M from Canaan, Sofinnova, Indaco Venture Partners and Vertis
  to fund IND-enabling studies of its lead oncology program. It was surfaced as a
  portfolio company of canaan-partners and added to the API Evangelist network as
  a stub. NOTE: this is a therapeutics/drug-discovery company with no public API,
  developer portal, or software product surface; its website (intrepidabio.com) no
  longer resolves and the entity appears dormant/defunct, so no API artifacts
  apply.
